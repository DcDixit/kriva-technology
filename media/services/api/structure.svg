<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-labelledby="title desc">
  <title id="title">Integration architecture</title>
  <desc id="desc">Five equal stages: source event, connector, validate, destination API, then exception or audit.</desc>
  <defs>
    <pattern id="g2" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#D6D5CD"/>
    </pattern>
  </defs>

  <rect width="1200" height="900" fill="#F4F3EE"/>
  <rect width="1200" height="900" fill="url(#g2)" opacity=".7"/>
  <rect x="48" y="48" width="1104" height="804" fill="#FFFFFF" stroke="#D6D5CD"/>

  <text x="96" y="120" fill="#5C6670" font-family="system-ui,sans-serif" font-size="12" letter-spacing="2.4">ONE PATH · EVERY API</text>
  <text x="96" y="164" fill="#0E1216" font-family="system-ui,sans-serif" font-size="32" font-weight="700">Source to audit</text>
  <text x="96" y="198" fill="#5C6670" font-family="system-ui,sans-serif" font-size="15">Bitbucket webhooks, ledger posts, and CRM writes share this structure.</text>

  <!-- Vertical spine -->
  <line x1="160" y1="248" x2="160" y2="780" stroke="#D6D5CD" stroke-width="2"/>

  <!-- 01 -->
  <circle cx="160" cy="280" r="10" fill="#4F46E5"/>
  <text x="160" y="284" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif" font-size="10" font-weight="700">01</text>
  <rect x="208" y="244" width="880" height="88" fill="#F4F3EE" stroke="#D6D5CD"/>
  <text x="236" y="280" fill="#5C6670" font-family="system-ui,sans-serif" font-size="11" letter-spacing="2">SOURCE EVENT</text>
  <text x="236" y="308" fill="#0E1216" font-family="system-ui,sans-serif" font-size="18" font-weight="700">Queued with a stable key · product, Bitbucket, or CRM</text>

  <!-- 02 -->
  <circle cx="160" cy="396" r="10" fill="#4F46E5"/>
  <text x="160" y="400" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif" font-size="10" font-weight="700">02</text>
  <rect x="208" y="360" width="880" height="88" fill="#0E1216"/>
  <text x="236" y="396" fill="#8C98A4" font-family="system-ui,sans-serif" font-size="11" letter-spacing="2">CONNECTOR</text>
  <text x="236" y="424" fill="#FFFFFF" font-family="system-ui,sans-serif" font-size="18" font-weight="700">Workers, backoff, and documented endpoints only</text>

  <!-- 03 -->
  <circle cx="160" cy="512" r="10" fill="#4F46E5"/>
  <text x="160" y="516" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif" font-size="10" font-weight="700">03</text>
  <rect x="208" y="476" width="880" height="88" fill="#F4F3EE" stroke="#D6D5CD"/>
  <text x="236" y="512" fill="#5C6670" font-family="system-ui,sans-serif" font-size="11" letter-spacing="2">VALIDATE</text>
  <text x="236" y="540" fill="#0E1216" font-family="system-ui,sans-serif" font-size="18" font-weight="700">Schema, mapping, and idempotency before the write</text>

  <!-- 04 -->
  <circle cx="160" cy="628" r="10" fill="#4F46E5"/>
  <text x="160" y="632" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif" font-size="10" font-weight="700">04</text>
  <rect x="208" y="592" width="880" height="88" fill="#F4F3EE" stroke="#D6D5CD"/>
  <text x="236" y="628" fill="#5C6670" font-family="system-ui,sans-serif" font-size="11" letter-spacing="2">DESTINATION API</text>
  <text x="236" y="656" fill="#0E1216" font-family="system-ui,sans-serif" font-size="18" font-weight="700">Ledger, CRM, payments, or Bitbucket Pipelines</text>

  <!-- 05 -->
  <circle cx="160" cy="744" r="10" fill="#DB9B1F"/>
  <text x="160" y="748" text-anchor="middle" fill="#0E1216" font-family="system-ui,sans-serif" font-size="10" font-weight="700">05</text>
  <rect x="208" y="708" width="880" height="88" fill="#FFFFFF" stroke="#DB9B1F"/>
  <text x="236" y="744" fill="#DB9B1F" font-family="system-ui,sans-serif" font-size="11" letter-spacing="2">EXCEPTION OR AUDIT</text>
  <text x="236" y="772" fill="#0E1216" font-family="system-ui,sans-serif" font-size="18" font-weight="700">Match confirms, or an operator finishes the record</text>
</svg>
