<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-labelledby="title desc">
  <title id="title">Operator resolving an API exception</title>
  <desc id="desc">A vector illustration of an operator reviewing a source and destination mismatch with retry, match, and park actions.</desc>
  <defs>
    <pattern id="g3" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#D6D5CD"/>
    </pattern>
  </defs>

  <rect width="1200" height="900" fill="#F4F3EE"/>
  <rect width="1200" height="900" fill="url(#g3)" opacity=".7"/>
  <rect x="48" y="48" width="1104" height="804" fill="#FFFFFF" stroke="#D6D5CD"/>

  <!-- Exception card -->
  <rect x="96" y="140" width="620" height="620" fill="#0E1216"/>
  <rect x="96" y="140" width="6" height="620" fill="#DB9B1F"/>
  <text x="136" y="188" fill="#8C98A4" font-family="system-ui,sans-serif" font-size="11" letter-spacing="2.4">EVT-8814 · BLOCKS SYNC</text>
  <text x="136" y="240" fill="#FFFFFF" font-family="system-ui,sans-serif" font-size="28" font-weight="700">Mapping mismatch</text>
  <text x="136" y="276" fill="#8C98A4" font-family="system-ui,sans-serif" font-size="15">Bitbucket webhook  product job</text>

  <rect x="136" y="320" width="250" height="120" fill="#161C22" stroke="#232B33"/>
  <text x="156" y="356" fill="#8C98A4" font-family="system-ui,sans-serif" font-size="11" letter-spacing="1.8">SOURCE</text>
  <text x="156" y="400" fill="#FFFFFF" font-family="system-ui,sans-serif" font-size="26" font-weight="700">PR-2041</text>

  <rect x="406" y="320" width="250" height="120" fill="#161C22" stroke="#232B33"/>
  <text x="426" y="356" fill="#8C98A4" font-family="system-ui,sans-serif" font-size="11" letter-spacing="1.8">DESTINATION</text>
  <text x="426" y="400" fill="#FFFFFF" font-family="system-ui,sans-serif" font-size="26" font-weight="700">JOB-091</text>

  <text x="136" y="490" fill="#B9C3CC" font-family="system-ui,sans-serif" font-size="15">Reason: pipeline ref does not match open job.</text>
  <text x="136" y="518" fill="#8C98A4" font-family="system-ui,sans-serif" font-size="14">Owner · Ops  ·  14:22</text>

  <rect x="136" y="560" width="150" height="52" fill="#4F46E5"/>
  <text x="211" y="592" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif" font-size="13" font-weight="600" letter-spacing="1.4">RETRY</text>
  <rect x="302" y="560" width="150" height="52" fill="none" stroke="#3A444E"/>
  <text x="377" y="592" text-anchor="middle" fill="#DDE2E7" font-family="system-ui,sans-serif" font-size="13" font-weight="600" letter-spacing="1.4">MATCH</text>
  <rect x="468" y="560" width="150" height="52" fill="none" stroke="#3A444E"/>
  <text x="543" y="592" text-anchor="middle" fill="#DDE2E7" font-family="system-ui,sans-serif" font-size="13" font-weight="600" letter-spacing="1.4">PARK</text>

  <text x="136" y="680" fill="#717F8C" font-family="system-ui,sans-serif" font-size="12">Audit remains open until the record is named and closed.</text>

  <!-- Operator figure (geometric, not photographic) -->
  <rect x="780" y="220" width="300" height="460" fill="#F4F3EE" stroke="#D6D5CD"/>
  <!-- desk -->
  <rect x="808" y="560" width="244" height="16" fill="#0E1216"/>
  <rect x="848" y="576" width="24" height="72" fill="#0E1216"/>
  <rect x="988" y="576" width="24" height="72" fill="#0E1216"/>
  <!-- monitor -->
  <rect x="858" y="360" width="144" height="96" fill="#0E1216"/>
  <rect x="870" y="372" width="120" height="72" fill="#161C22"/>
  <rect x="882" y="392" width="56" height="6" fill="#4F46E5"/>
  <rect x="882" y="408" width="96" height="4" fill="#3A444E"/>
  <rect x="882" y="420" width="72" height="4" fill="#3A444E"/>
  <rect x="910" y="456" width="40" height="8" fill="#0E1216"/>
  <!-- person -->
  <circle cx="930" cy="292" r="28" fill="#C9B8A8"/>
  <path d="M902 320 C902 308 958 308 958 320 L958 368 C958 392 902 392 902 368 Z" fill="#4F46E5"/>
  <rect x="888" y="368" width="84" height="96" fill="#0E1216"/>
  <rect x="868" y="392" width="28" height="10" rx="4" fill="#C9B8A8"/>
  <rect x="964" y="392" width="28" height="10" rx="4" fill="#C9B8A8"/>
  <text x="930" y="720" text-anchor="middle" fill="#5C6670" font-family="system-ui,sans-serif" font-size="12" letter-spacing="1.8">OPERATOR · NOT A TICKET</text>
</svg>
