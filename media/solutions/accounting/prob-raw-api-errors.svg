<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 400" width="480" height="400" role="img" aria-label="Illustration: an error log of raw API messages that finance cannot act on">
  <defs><linearGradient id="e-bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#12181E"/><stop offset="100%" stop-color="#0E1216"/></linearGradient></defs>
  <g font-family="Figtree,system-ui,sans-serif">
  <rect width="480" height="400" fill="url(#e-bg)"/>
  <rect x="16" y="16" width="448" height="36" fill="#12181E" stroke="#232B33"/>
  <circle cx="32" cy="34" r="4" fill="#5C6670"/><circle cx="46" cy="34" r="4" fill="#2A333C"/><circle cx="60" cy="34" r="4" fill="#2A333C"/>
  <text x="76" y="38" fill="#8C98A4" font-size="10" letter-spacing=".12em">SYNC ERRORS · 46 UNREAD</text>
  <g font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="11">
    <rect x="32" y="68" width="416" height="34" rx="4" fill="#161C22" stroke="#232B33"/>
    <text x="46" y="89" fill="#DB9B1F">400</text><text x="82" y="89" fill="#B9C3CC">ValidationException: line 3</text>
    <rect x="32" y="108" width="416" height="34" rx="4" fill="#161C22" stroke="#232B33"/>
    <text x="46" y="129" fill="#DB9B1F">429</text><text x="82" y="129" fill="#B9C3CC">Too many requests, retry later</text>
    <rect x="32" y="148" width="416" height="34" rx="4" fill="#161C22" stroke="#232B33"/>
    <text x="46" y="169" fill="#DB9B1F">401</text><text x="82" y="169" fill="#B9C3CC">token expired</text>
    <rect x="32" y="188" width="416" height="34" rx="4" fill="#161C22" stroke="#232B33"/>
    <text x="46" y="209" fill="#DB9B1F">400</text><text x="82" y="209" fill="#B9C3CC">Invalid TaxCode reference</text>
    <rect x="32" y="228" width="416" height="34" rx="4" fill="#161C22" stroke="#232B33"/>
    <text x="46" y="249" fill="#DB9B1F">500</text><text x="82" y="249" fill="#B9C3CC">{"Fault":{"type":"SystemFault"}}</text>
  </g>
  <rect x="32" y="282" width="416" height="86" rx="4" fill="#12181E" stroke="#DB9B1F"/>
  <text x="48" y="308" fill="#DB9B1F" font-size="10" letter-spacing=".1em">FINANCE NEXT STEP</text>
  <text x="48" y="332" fill="#FFFFFF" font-size="15" font-weight="700">None. Open a ticket and wait.</text>
  <text x="48" y="352" fill="#8C98A4" font-size="12">No invoice, customer, or amount on any row</text>
  </g>
</svg>
