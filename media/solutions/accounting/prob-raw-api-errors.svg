<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 400" width="480" height="400" role="img" aria-label="Raw API errors with no invoice and no next step for finance">
  <rect width="480" height="400" fill="#0F1C2E"/>
  <rect x="20" y="20" width="440" height="360" rx="16" fill="#16263B"/>
  <text x="44" y="68" fill="#A5B4FC" font-family="Figtree,system-ui,sans-serif" font-size="16" font-weight="700">45 unread errors</text>
  <text x="44" y="128" fill="#FFFFFF" font-family="Figtree,system-ui,sans-serif" font-size="22" font-weight="700">400</text>
  <text x="120" y="128" fill="#DDE2E7" font-family="Figtree,system-ui,sans-serif" font-size="20">Validation failed</text>
  <text x="44" y="176" fill="#FFFFFF" font-family="Figtree,system-ui,sans-serif" font-size="22" font-weight="700">401</text>
  <text x="120" y="176" fill="#DDE2E7" font-family="Figtree,system-ui,sans-serif" font-size="20">Token expired</text>
  <text x="44" y="224" fill="#FFFFFF" font-family="Figtree,system-ui,sans-serif" font-size="22" font-weight="700">429</text>
  <text x="120" y="224" fill="#DDE2E7" font-family="Figtree,system-ui,sans-serif" font-size="20">Too many requests</text>
  <rect x="44" y="268" width="392" height="72" rx="12" fill="#1C2838" stroke="#F5D76E" stroke-width="1.5"/>
  <text x="240" y="300" text-anchor="middle" fill="#F5D76E" font-family="Figtree,system-ui,sans-serif" font-size="18" font-weight="700">No invoice on any row</text>
  <text x="240" y="324" text-anchor="middle" fill="#C5D0DC" font-family="Figtree,system-ui,sans-serif" font-size="16">Finance has no next step</text>
</svg>
