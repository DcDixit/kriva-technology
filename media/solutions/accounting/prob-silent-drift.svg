<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 400" width="480" height="400" role="img" aria-label="A sync marked successful while the product total and the ledger total disagree">
  <rect width="480" height="400" fill="#0F1C2E"/>
  <rect x="20" y="20" width="440" height="360" rx="16" fill="#16263B"/>
  <text x="44" y="68" fill="#A5B4FC" font-family="Figtree,system-ui,sans-serif" font-size="16" font-weight="700">Job completed · 0 errors</text>
  <text x="44" y="128" fill="#C5D0DC" font-family="Figtree,system-ui,sans-serif" font-size="16">Your product</text>
  <text x="44" y="166" fill="#FFFFFF" font-family="Figtree,system-ui,sans-serif" font-size="32" font-weight="700">48,215</text>
  <text x="44" y="214" fill="#C5D0DC" font-family="Figtree,system-ui,sans-serif" font-size="16">Ledger</text>
  <text x="44" y="252" fill="#F5D76E" font-family="Figtree,system-ui,sans-serif" font-size="32" font-weight="700">47,930</text>
  <rect x="44" y="284" width="392" height="64" rx="12" fill="#1C2838" stroke="#F5D76E" stroke-width="1.5"/>
  <text x="240" y="324" text-anchor="middle" fill="#F5D76E" font-family="Figtree,system-ui,sans-serif" font-size="18" font-weight="700">Off by 285 · not in the product</text>
</svg>
