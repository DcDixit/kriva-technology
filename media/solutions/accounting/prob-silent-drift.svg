<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 400" width="480" height="400" role="img" aria-label="Illustration: a sync job marked successful while source and ledger totals disagree">
  <defs><linearGradient id="d-bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#12181E"/><stop offset="100%" stop-color="#0E1216"/></linearGradient></defs>
  <g font-family="Figtree,system-ui,sans-serif">
  <rect width="480" height="400" fill="url(#d-bg)"/>
  <rect x="16" y="16" width="448" height="36" fill="#12181E" stroke="#232B33"/>
  <circle cx="32" cy="34" r="4" fill="#5C6670"/><circle cx="46" cy="34" r="4" fill="#2A333C"/><circle cx="60" cy="34" r="4" fill="#2A333C"/>
  <text x="76" y="38" fill="#8C98A4" font-size="10" letter-spacing=".12em">NIGHTLY SYNC · INVOICES</text>
  <rect x="32" y="72" width="416" height="56" rx="4" fill="#161C22" stroke="#232B33"/>
  <circle cx="54" cy="100" r="9" fill="#1F3A2A"/>
  <path d="M49.5 100.5l3 3 6-6.5" fill="none" stroke="#5BC08A" stroke-width="2"/>
  <text x="74" y="96" fill="#FFFFFF" font-size="14" font-weight="700">Job completed</text>
  <text x="74" y="114" fill="#8C98A4" font-size="11.5">312 records sent · 0 errors</text>
  <text x="432" y="104" text-anchor="end" fill="#5BC08A" font-size="10" letter-spacing=".1em">SUCCESS</text>
  <text x="32" y="160" fill="#8C98A4" font-size="10" letter-spacing=".12em">MONTH TOTALS</text>
  <rect x="32" y="172" width="200" height="76" rx="4" fill="#161C22" stroke="#232B33"/>
  <text x="48" y="196" fill="#8C98A4" font-size="11">Your product</text>
  <text x="48" y="228" fill="#FFFFFF" font-size="22" font-weight="700">48,215.40</text>
  <rect x="248" y="172" width="200" height="76" rx="4" fill="#161C22" stroke="#DB9B1F"/>
  <text x="264" y="196" fill="#8C98A4" font-size="11">Ledger</text>
  <text x="264" y="228" fill="#DB9B1F" font-size="22" font-weight="700">47,930.15</text>
  <rect x="32" y="264" width="416" height="44" rx="4" fill="#12181E" stroke="#232B33" stroke-dasharray="4 4"/>
  <text x="48" y="291" fill="#B9C3CC" font-size="12.5">Difference 285.25 · not shown anywhere in the product</text>
  <rect x="32" y="324" width="416" height="44" rx="4" fill="#12181E" stroke="#DB9B1F"/>
  <text x="48" y="351" fill="#DB9B1F" font-size="10" letter-spacing=".1em">FOUND LATER</text>
  <text x="142" y="351" fill="#DDE2E7" font-size="12.5">in a month-end spreadsheet</text>
  </g>
</svg>
