<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 400" width="480" height="400" role="img" aria-label="Illustration: a timed-out request retried, posting the same invoice to the ledger twice">
  <defs><linearGradient id="r-bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#12181E"/><stop offset="100%" stop-color="#0E1216"/></linearGradient></defs>
  <g font-family="Figtree,system-ui,sans-serif">
  <rect width="480" height="400" fill="url(#r-bg)"/>
  <rect x="16" y="16" width="448" height="36" fill="#12181E" stroke="#232B33"/>
  <circle cx="32" cy="34" r="4" fill="#5C6670"/><circle cx="46" cy="34" r="4" fill="#2A333C"/><circle cx="60" cy="34" r="4" fill="#2A333C"/>
  <text x="76" y="38" fill="#8C98A4" font-size="10" letter-spacing=".12em">POST INVOICE · INV-1187</text>
  <rect x="32" y="72" width="416" height="40" rx="4" fill="#161C22" stroke="#232B33"/>
  <text x="48" y="97" fill="#8C98A4" font-size="10" letter-spacing=".1em">14:02:11</text>
  <text x="124" y="97" fill="#DDE2E7" font-size="12.5">Send to ledger</text>
  <text x="432" y="97" text-anchor="end" fill="#DB9B1F" font-size="10" letter-spacing=".1em">TIMED OUT</text>
  <rect x="32" y="120" width="416" height="40" rx="4" fill="#161C22" stroke="#232B33"/>
  <text x="48" y="145" fill="#8C98A4" font-size="10" letter-spacing=".1em">14:02:41</text>
  <text x="124" y="145" fill="#DDE2E7" font-size="12.5">Retry, no source key</text>
  <text x="432" y="145" text-anchor="end" fill="#5BC08A" font-size="10" letter-spacing=".1em">201 CREATED</text>
  <text x="32" y="192" fill="#8C98A4" font-size="10" letter-spacing=".12em">LEDGER · ACCOUNTS RECEIVABLE</text>
  <rect x="32" y="204" width="416" height="44" rx="4" fill="#161C22" stroke="#232B33"/>
  <text x="48" y="231" fill="#FFFFFF" font-size="13" font-weight="700">INV-1187</text>
  <text x="140" y="231" fill="#B9C3CC" font-size="12.5">Brightside Ltd</text>
  <text x="432" y="231" text-anchor="end" fill="#FFFFFF" font-size="13" font-weight="700">2,640.00</text>
  <rect x="32" y="256" width="416" height="44" rx="4" fill="#161C22" stroke="#DB9B1F"/>
  <text x="48" y="283" fill="#DB9B1F" font-size="13" font-weight="700">INV-1187</text>
  <text x="140" y="283" fill="#B9C3CC" font-size="12.5">Brightside Ltd</text>
  <text x="432" y="283" text-anchor="end" fill="#DB9B1F" font-size="13" font-weight="700">2,640.00</text>
  <rect x="32" y="316" width="416" height="52" rx="4" fill="#12181E" stroke="#DB9B1F"/>
  <text x="48" y="338" fill="#DB9B1F" font-size="10" letter-spacing=".1em">RESULT</text>
  <text x="48" y="357" fill="#DDE2E7" font-size="12.5">Receivables overstated by 2,640.00</text>
  </g>
</svg>
