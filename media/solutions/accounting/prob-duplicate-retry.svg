<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 400" width="480" height="400" role="img" aria-label="A timed-out invoice is retried and posted twice at 2,640">
  <rect width="480" height="400" fill="#0F1C2E"/>
  <rect x="20" y="20" width="440" height="360" rx="16" fill="#16263B"/>
  <text x="44" y="68" fill="#A5B4FC" font-family="Figtree,system-ui,sans-serif" font-size="16" font-weight="700">Retry after a timeout</text>
  <text x="44" y="130" fill="#FFFFFF" font-family="Figtree,system-ui,sans-serif" font-size="22" font-weight="700">INV-1187</text>
  <text x="436" y="130" text-anchor="end" fill="#FFFFFF" font-family="Figtree,system-ui,sans-serif" font-size="22" font-weight="700">2,640.00</text>
  <text x="44" y="178" fill="#F5D76E" font-family="Figtree,system-ui,sans-serif" font-size="22" font-weight="700">INV-1187</text>
  <text x="436" y="178" text-anchor="end" fill="#F5D76E" font-family="Figtree,system-ui,sans-serif" font-size="22" font-weight="700">2,640.00</text>
  <text x="44" y="214" fill="#C5D0DC" font-family="Figtree,system-ui,sans-serif" font-size="16">Same invoice · posted again</text>
  <rect x="44" y="252" width="392" height="72" rx="12" fill="#1C2838" stroke="#F5D76E" stroke-width="1.5"/>
  <text x="240" y="294" text-anchor="middle" fill="#F5D76E" font-family="Figtree,system-ui,sans-serif" font-size="18" font-weight="700">The books are worse</text>
</svg>
