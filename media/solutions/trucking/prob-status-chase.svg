<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 400" width="480" height="400" role="img" aria-label="Driver call update running ahead of the TMS load status">
  <rect width="480" height="400" fill="#0F1C2E"/>
  <rect x="20" y="20" width="440" height="360" rx="16" fill="#16263B"/>
  <text x="44" y="72" fill="#FFFFFF" font-family="Figtree,system-ui,sans-serif" font-size="32" font-weight="700">DAL &#8594; PHX</text>
  <text x="44" y="128" fill="#A5B4FC" font-family="Figtree,system-ui,sans-serif" font-size="16" font-weight="700">TMS</text>
  <text x="250" y="128" fill="#F5D76E" font-family="Figtree,system-ui,sans-serif" font-size="16" font-weight="700">Driver call</text>
  <text x="44" y="172" fill="#FFFFFF" font-family="Figtree,system-ui,sans-serif" font-size="24" font-weight="700">Dispatched</text>
  <text x="250" y="172" fill="#FFFFFF" font-family="Figtree,system-ui,sans-serif" font-size="24" font-weight="700">At the dock</text>
  <text x="44" y="204" fill="#C5D0DC" font-family="Figtree,system-ui,sans-serif" font-size="18">3 hours ago</text>
  <text x="250" y="204" fill="#F5D76E" font-family="Figtree,system-ui,sans-serif" font-size="18">2 minutes ago</text>
  <rect x="44" y="248" width="392" height="64" rx="12" fill="#1C2838" stroke="#F5D76E" stroke-width="1.5"/>
  <text x="240" y="286" text-anchor="middle" fill="#F5D76E" font-family="Figtree,system-ui,sans-serif" font-size="20" font-weight="700">Not in the TMS yet</text>
  <text x="44" y="348" fill="#C5D0DC" font-family="Figtree,system-ui,sans-serif" font-size="16">The board is behind the call</text>
</svg>
