  <text x="36" y="134" fill="#F5D76E" font-family="Figtree,system-ui,sans-serif" font-size="18" font-weight="700">Unassigned</text>
  <line x1="36" y1="162" x2="214" y2="162" stroke="#2A3B52"/>
