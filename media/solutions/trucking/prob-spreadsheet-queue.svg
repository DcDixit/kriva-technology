<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 400" width="480" height="400" role="img" aria-label="Dispatch spreadsheet queue beside a stale TMS load board">
  <rect width="480" height="400" fill="#0F1C2E"/>
  <rect x="16" y="16" width="218" height="368" rx="16" fill="#16263B"/>
