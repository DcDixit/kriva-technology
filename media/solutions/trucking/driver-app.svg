  <text x="28" y="342" fill="#C5D0DC" font-family="Figtree,system-ui,sans-serif" font-size="18">in the yard</text>
  <rect x="318" y="20" width="294" height="360" rx="32" fill="#0A0E14" stroke="#2A3B52" stroke-width="2"/>
  <rect x="334" y="44" width="262" height="316" rx="22" fill="#16263B"/>
  <text x="354" y="88" fill="#C5D0DC" font-family="Figtree,system-ui,sans-serif" font-size="16">M. Diaz</text>
  <text x="354" y="132" fill="#FFFFFF" font-family="Figtree,system-ui,sans-serif" font-size="28" font-weight="700">SEA &#8594; PDX</text>
  <text x="354" y="162" fill="#C5D0DC" font-family="Figtree,system-ui,sans-serif" font-size="16">Pickup 7:00&#8211;9:00</text>
