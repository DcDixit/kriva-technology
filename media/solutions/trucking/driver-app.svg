<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-label="Driver phone for the same load, with acceptance and photos queued offline">
  <rect width="640" height="400" fill="#0F1C2E"/>
  <text x="28" y="56" fill="#A5B4FC" font-family="Figtree,system-ui,sans-serif" font-size="16" font-weight="700">Same load</text>
