<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-label="Driver yard app beside the dispatch load row for the same shipment">
  <defs>
    <linearGradient id="daBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#12181E"/>
      <stop offset="100%" stop-color="#0E1216"/>
    </linearGradient>
    <linearGradient id="daPhone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#161C22"/>
      <stop offset="100%" stop-color="#0E1216"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="1000" fill="url(#daBg)"/>

  <rect width="1600" height="46" fill="#12181E"/>
  <line x1="0" y1="46" x2="1600" y2="46" stroke="#232B33"/>
  <circle cx="26" cy="23" r="4.5" fill="#5C6670"/>
  <circle cx="42" cy="23" r="4.5" fill="#2A333C"/>
  <circle cx="58" cy="23" r="4.5" fill="#2A333C"/>
  <text x="78" y="27" fill="#717F8C" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing=".12em">DRIVER · YARD · WEAK SIGNAL</text>
  <circle cx="1468" cy="23" r="4" fill="#DB9B1F"/>
  <text x="1480" y="27" fill="#DB9B1F" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing=".12em">QUEUED</text>

  <!-- Desk context: same load on the board -->
  <text x="48" y="92" fill="#FFFFFF" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="22" font-weight="700">Same load. Desk and yard.</text>
  <text x="48" y="118" fill="#8C98A4" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing=".08em">FIELD SURFACE SHIPS BESIDE THE DISPATCH BOARD</text>

  <rect x="48" y="148" width="720" height="72" fill="#161C22" stroke="#232B33"/>
  <text x="68" y="176" fill="#717F8C" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing=".12em">DISPATCH ROW</text>
  <text x="68" y="202" fill="#EDEFF1" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">#4825</text>
  <text x="160" y="202" fill="#B9C3CC" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">SEA → PDX</text>
  <rect x="640" y="184" width="108" height="22" fill="none" stroke="#717F8C"/>
  <text x="656" y="200" fill="#717F8C" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" letter-spacing=".1em">ASSIGNED</text>

  <rect x="48" y="236" width="720" height="200" fill="#161C22" stroke="#232B33"/>
  <text x="68" y="268" fill="#717F8C" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing=".12em">WHY THE PHONE EXISTS</text>
  <text x="68" y="304" fill="#DDE2E7" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="16">Acceptance, stop progression, and POD on weak yard signal — one-handed.</text>
  <text x="68" y="336" fill="#8C98A4" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="15">Updates queue on device. They sync when signal returns. The load row on the desk does not wait on a call.</text>
  <rect x="68" y="364" width="14" height="14" fill="#4F46E5"/>
  <path d="M71 371l3 3 6-6" fill="none" stroke="#fff" stroke-width="1.6"/>
  <text x="92" y="376" fill="#B9C3CC" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">One-tap accept</text>
  <rect x="280" y="364" width="14" height="14" fill="#4F46E5"/>
  <path d="M283 371l3 3 6-6" fill="none" stroke="#fff" stroke-width="1.6"/>
  <text x="304" y="376" fill="#B9C3CC" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">Queued POD</text>
  <rect x="468" y="364" width="14" height="14" fill="#4F46E5"/>
  <path d="M471 371l3 3 6-6" fill="none" stroke="#fff" stroke-width="1.6"/>
  <text x="492" y="376" fill="#B9C3CC" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">Offline retry</text>

  <rect x="48" y="452" width="720" height="430" fill="#161C22" stroke="#232B33"/>
  <text x="68" y="484" fill="#717F8C" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing=".12em">SYNC STATE</text>
  <text x="68" y="528" fill="#FFFFFF" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="18" font-weight="700">2 frames on device</text>
  <text x="68" y="556" fill="#8C98A4" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="15">POD photos captured. Upload waits for signal — not a failed tap.</text>
  <rect x="68" y="584" width="680" height="8" fill="#1A2027"/>
  <rect x="68" y="584" width="210" height="8" fill="#DB9B1F"/>
  <text x="68" y="620" fill="#DB9B1F" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing=".1em">QUEUED · SENDS WHEN SIGNAL RETURNS</text>

  <line x1="68" y1="648" x2="748" y2="648" stroke="#232B33"/>
  <text x="68" y="688" fill="#717F8C" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing=".12em">STOP PROGRESSION</text>
  <text x="68" y="724" fill="#5FD3A0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">01  ACCEPTED</text>
  <text x="68" y="760" fill="#EDEFF1" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">02  ON SITE · YARD</text>
  <text x="68" y="796" fill="#717F8C" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">03  LOADED</text>
  <text x="68" y="832" fill="#717F8C" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">04  DELIVERED · POD</text>

  <!-- Phone -->
  <rect x="860" y="72" width="680" height="850" rx="40" fill="#0A0D10" stroke="#2A333C" stroke-width="2"/>
  <rect x="884" y="96" width="632" height="802" rx="28" fill="url(#daPhone)"/>
  <rect x="1148" y="108" width="104" height="8" rx="4" fill="#232B33"/>

  <text x="908" y="148" fill="#8C98A4" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing=".12em">YARD · WEAK SIGNAL</text>
  <text x="1396" y="148" fill="#EDEFF1" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">06:42</text>

  <text x="908" y="204" fill="#FFFFFF" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="36" font-weight="800" letter-spacing="-.03em">M. Diaz</text>
  <text x="908" y="232" fill="#8C98A4" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">HOS  6h 12m remaining</text>

  <line x1="908" y1="260" x2="1492" y2="260" stroke="#232B33"/>
  <text x="908" y="292" fill="#8C98A4" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">#4825</text>
  <text x="908" y="340" fill="#FFFFFF" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="34" font-weight="800" letter-spacing="-.03em">SEA → PDX</text>
  <text x="908" y="372" fill="#8C98A4" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" letter-spacing=".06em">PICKUP  07:00–09:00</text>

  <line x1="908" y1="400" x2="1492" y2="400" stroke="#232B33"/>
  <text x="908" y="440" fill="#FFFFFF" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="16" font-weight="600">POD · 2 frames on device</text>
  <text x="908" y="466" fill="#8C98A4" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing=".08em">SENDS WHEN SIGNAL RETURNS</text>
  <rect x="1368" y="424" width="124" height="28" fill="none" stroke="#DB9B1F"/>
  <circle cx="1384" cy="438" r="3" fill="#DB9B1F"/>
  <text x="1394" y="443" fill="#DB9B1F" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing=".1em">QUEUED</text>

  <rect x="908" y="500" width="584" height="64" fill="#5FD3A0"/>
  <text x="1200" y="540" text-anchor="middle" fill="#0E1216" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="700" letter-spacing=".12em">ACCEPT LOAD</text>
  <rect x="908" y="580" width="584" height="64" fill="none" stroke="#DDE2E7"/>
  <text x="1200" y="620" text-anchor="middle" fill="#FFFFFF" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="700" letter-spacing=".12em">ON SITE</text>

  <text x="908" y="700" fill="#717F8C" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing=".12em">NEXT STOP</text>
  <text x="908" y="732" fill="#DDE2E7" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="16">Portland DC · door 12</text>
  <text x="908" y="758" fill="#8C98A4" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">APPT  14:00–16:00</text>

  <rect y="922" width="1600" height="78" fill="#10161C"/>
  <line x1="0" y1="922" x2="1600" y2="922" stroke="#232B33"/>
  <text x="48" y="956" fill="#717F8C" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing=".1em">ROLLOUT</text>
  <text x="140" y="956" fill="#DDE2E7" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" letter-spacing=".06em">DRIVER APP SHIPS IN PARALLEL · DESK STAYS ON THE TMS UNTIL SIGN-OFF</text>
  <text x="48" y="980" fill="#5A6570" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing=".08em">Phased cutover: field surface first, then billing sync. Dispatch does not stop.</text>
</svg>
