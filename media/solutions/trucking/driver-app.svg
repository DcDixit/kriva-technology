  <text x="48" y="214" fill="#FFFFFF" font-family="Figtree,system-ui,sans-serif" font-size="24" font-weight="700">2 photos</text>
  <text x="48" y="244" fill="#F5D76E" font-family="Figtree,system-ui,sans-serif" font-size="16">Queued for signal</text>
