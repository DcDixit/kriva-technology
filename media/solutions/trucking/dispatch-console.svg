<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-label="Dispatch load board with time left on every row and one load at risk">
  <rect width="640" height="400" fill="#0F1C2E"/>
  <text x="28" y="48" fill="#FFFFFF" font-family="Figtree,system-ui,sans-serif" font-size="28" font-weight="700">Load board</text>
  <rect x="476" y="20" width="136" height="40" rx="10" fill="#4F46E5"/>
  <text x="544" y="46" text-anchor="middle" fill="#FFFFFF" font-family="Figtree,system-ui,sans-serif" font-size="18" font-weight="700">Assign 3</text>
  <text x="28" y="108" fill="#FFFFFF" font-family="Figtree,system-ui,sans-serif" font-size="36" font-weight="800">47</text>
  <text x="84" y="108" fill="#C5D0DC" font-family="Figtree,system-ui,sans-serif" font-size="18">on the board</text>
  <text x="250" y="108" fill="#F5D76E" font-family="Figtree,system-ui,sans-serif" font-size="36" font-weight="800">2</text>
  <text x="282" y="108" fill="#F5D76E" font-family="Figtree,system-ui,sans-serif" font-size="18">at risk</text>
  <rect x="20" y="136" width="600" height="64" rx="12" fill="#16263B"/>
  <text x="40" y="176" fill="#FFFFFF" font-family="Figtree,system-ui,sans-serif" font-size="24" font-weight="700">ATL &#8594; CLT</text>
  <text x="580" y="176" text-anchor="end" fill="#C5D0DC" font-family="Figtree,system-ui,sans-serif" font-size="22">42m</text>
  <rect x="20" y="212" width="600" height="64" rx="12" fill="#2A2416" stroke="#F5D76E" stroke-width="1.5"/>
  <text x="40" y="252" fill="#FFFFFF" font-family="Figtree,system-ui,sans-serif" font-size="24" font-weight="700">SEA &#8594; PDX</text>
  <text x="580" y="252" text-anchor="end" fill="#F5D76E" font-family="Figtree,system-ui,sans-serif" font-size="22" font-weight="700">6m</text>
  <rect x="20" y="288" width="600" height="64" rx="12" fill="#16263B"/>
  <text x="40" y="328" fill="#FFFFFF" font-family="Figtree,system-ui,sans-serif" font-size="24" font-weight="700">CHI &#8594; DET</text>
  <text x="580" y="328" text-anchor="end" fill="#C5D0DC" font-family="Figtree,system-ui,sans-serif" font-size="22">18m</text>
  <text x="28" y="378" fill="#C5D0DC" font-family="Figtree,system-ui,sans-serif" font-size="18">3 loads assigned together &#183; logged</text>
