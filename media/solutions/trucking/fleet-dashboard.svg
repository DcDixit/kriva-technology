<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-label="Operations morning scan with on-time rate, three lanes, and one exception">
  <rect width="640" height="400" fill="#0F1C2E"/>
  <text x="28" y="46" fill="#FFFFFF" font-family="Figtree,system-ui,sans-serif" font-size="28" font-weight="700">Morning scan</text>
  <text x="250" y="46" fill="#C5D0DC" font-family="Figtree,system-ui,sans-serif" font-size="16">East &#183; 6:40</text>
  <text x="28" y="100" fill="#FFFFFF" font-family="Figtree,system-ui,sans-serif" font-size="34" font-weight="800">24</text>
  <text x="28" y="124" fill="#C5D0DC" font-family="Figtree,system-ui,sans-serif" font-size="16">Rolling</text>
  <text x="180" y="100" fill="#F5D76E" font-family="Figtree,system-ui,sans-serif" font-size="34" font-weight="800">5</text>
  <text x="180" y="124" fill="#F5D76E" font-family="Figtree,system-ui,sans-serif" font-size="16">Exceptions</text>
  <text x="400" y="100" fill="#FFFFFF" font-family="Figtree,system-ui,sans-serif" font-size="34" font-weight="800">94%</text>
  <text x="400" y="124" fill="#C5D0DC" font-family="Figtree,system-ui,sans-serif" font-size="16">On time</text>
  <text x="28" y="160" fill="#FFFFFF" font-family="Figtree,system-ui,sans-serif" font-size="20" font-weight="700">DAL &#8594; PHX</text>
  <rect x="188" y="144" width="300" height="16" rx="8" fill="#1C2838"/>
  <rect x="188" y="144" width="286" height="16" rx="8" fill="#A5B4FC"/>
  <text x="504" y="158" fill="#FFFFFF" font-family="Figtree,system-ui,sans-serif" font-size="18" font-weight="700">96%</text>
  <text x="28" y="208" fill="#FFFFFF" font-family="Figtree,system-ui,sans-serif" font-size="20" font-weight="700">CHI &#8594; DET</text>
  <rect x="188" y="192" width="300" height="16" rx="8" fill="#1C2838"/>
  <rect x="188" y="192" width="250" height="16" rx="8" fill="#A5B4FC"/>
  <text x="504" y="206" fill="#FFFFFF" font-family="Figtree,system-ui,sans-serif" font-size="18" font-weight="700">84%</text>
  <text x="28" y="256" fill="#F5D76E" font-family="Figtree,system-ui,sans-serif" font-size="20" font-weight="700">SEA &#8594; PDX</text>
  <rect x="188" y="240" width="300" height="16" rx="8" fill="#1C2838"/>
  <rect x="188" y="240" width="220" height="16" rx="8" fill="#F5D76E"/>
  <text x="504" y="254" fill="#F5D76E" font-family="Figtree,system-ui,sans-serif" font-size="18" font-weight="700">78%</text>
  <rect x="20" y="292" width="600" height="80" rx="14" fill="#2A2416" stroke="#F5D76E" stroke-width="1.5"/>
  <text x="40" y="328" fill="#FFFFFF" font-family="Figtree,system-ui,sans-serif" font-size="22" font-weight="700">Act on SEA &#8594; PDX</text>
  <text x="40" y="354" fill="#F5D76E" font-family="Figtree,system-ui,sans-serif" font-size="18">6 minutes left &#183; before the customer calls</text>
</svg>
