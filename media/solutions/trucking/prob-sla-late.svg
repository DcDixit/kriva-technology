<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 400" width="480" height="400" role="img" aria-label="SLA exception surfacing after the delivery window slipped">
  <rect width="480" height="400" fill="#0F1C2E"/>
  <rect x="20" y="20" width="440" height="360" rx="16" fill="#16263B"/>
  <text x="44" y="68" fill="#F5D76E" font-family="Figtree,system-ui,sans-serif" font-size="16" font-weight="700">Exception</text>
  <text x="44" y="116" fill="#FFFFFF" font-family="Figtree,system-ui,sans-serif" font-size="32" font-weight="700">CHI &#8594; DFW</text>
  <text x="44" y="150" fill="#C5D0DC" font-family="Figtree,system-ui,sans-serif" font-size="18">Detention risk</text>
