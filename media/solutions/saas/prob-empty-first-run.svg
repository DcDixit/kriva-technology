<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 400" width="480" height="400" role="img" aria-label="A new workspace with zero records and no next step">
  <rect width="480" height="400" fill="#0F1C2E"/>
  <rect x="20" y="20" width="440" height="360" rx="16" fill="#16263B"/>
  <text x="44" y="68" fill="#A5B4FC" font-family="Figtree,system-ui,sans-serif" font-size="16" font-weight="700">New workspace</text>
  <text x="44" y="124" fill="#FFFFFF" font-family="Figtree,system-ui,sans-serif" font-size="32" font-weight="700">0 records</text>
  <text x="44" y="160" fill="#C5D0DC" font-family="Figtree,system-ui,sans-serif" font-size="18">The home screen is empty</text>
  <rect x="44" y="204" width="392" height="72" rx="12" fill="#1C2838" stroke="#F5D76E" stroke-width="1.5"/>
  <text x="240" y="248" text-anchor="middle" fill="#F5D76E" font-family="Figtree,system-ui,sans-serif" font-size="20" font-weight="700">No next step</text>
