<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 400" width="480" height="400" role="img" aria-label="Illustration: three teams report different activation events while the account has no completed core action">
  <defs><linearGradient id="a-bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#12181E"/><stop offset="100%" stop-color="#0E1216"/></linearGradient></defs>
  <g font-family="Figtree,system-ui,sans-serif">
  <rect width="480" height="400" fill="url(#a-bg)"/>
  <rect x="16" y="16" width="448" height="36" fill="#12181E" stroke="#232B33"/>
  <circle cx="32" cy="34" r="4" fill="#5C6670"/><circle cx="46" cy="34" r="4" fill="#2A333C"/><circle cx="60" cy="34" r="4" fill="#2A333C"/>
  <text x="76" y="38" fill="#8C98A4" font-size="10" letter-spacing=".12em">WHAT COUNTS AS ACTIVATED?</text>
  <rect x="16" y="68" width="140" height="132" rx="6" fill="#161C22" stroke="#232B33"/>
  <text x="30" y="92" fill="#8C98A4" font-size="10" letter-spacing=".1em">PRODUCT</text>
  <text x="30" y="122" fill="#FFFFFF" font-size="15" font-weight="700">Checklist</text>
  <text x="30" y="141" fill="#FFFFFF" font-size="15" font-weight="700">complete</text>
  <path d="M32 176 l7 7 l13 -15" stroke="#A5B4FC" stroke-width="2.5" fill="none"/>
  <rect x="170" y="68" width="140" height="132" rx="6" fill="#161C22" stroke="#232B33"/>
  <text x="184" y="92" fill="#8C98A4" font-size="10" letter-spacing=".1em">GROWTH</text>
  <text x="184" y="122" fill="#FFFFFF" font-size="15" font-weight="700">Second</text>
  <text x="184" y="141" fill="#FFFFFF" font-size="15" font-weight="700">login</text>
  <path d="M186 176 l7 7 l13 -15" stroke="#A5B4FC" stroke-width="2.5" fill="none"/>
  <rect x="324" y="68" width="140" height="132" rx="6" fill="#161C22" stroke="#232B33"/>
  <text x="338" y="92" fill="#8C98A4" font-size="10" letter-spacing=".1em">DESIGN</text>
  <text x="338" y="122" fill="#FFFFFF" font-size="15" font-weight="700">Product tour</text>
  <text x="338" y="141" fill="#FFFFFF" font-size="15" font-weight="700">finished</text>
  <path d="M340 176 l7 7 l13 -15" stroke="#A5B4FC" stroke-width="2.5" fill="none"/>
  <path d="M86 210 L240 250 M240 210 L240 250 M394 210 L240 250" stroke="#3A444E" stroke-width="1.5" fill="none"/>
  <rect x="16" y="258" width="448" height="110" rx="6" fill="#12181E" stroke="#DB9B1F"/>
  <text x="32" y="284" fill="#DB9B1F" font-size="10" letter-spacing=".1em">THE ACCOUNT ITSELF</text>
  <text x="32" y="316" fill="#FFFFFF" font-size="17" font-weight="700">Core action completed: none</text>
  <text x="32" y="345" fill="#8C98A4" font-size="12.5">Three green ticks, and still no result for the customer.</text>
  </g>
</svg>
