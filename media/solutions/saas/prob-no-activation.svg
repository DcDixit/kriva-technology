<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 400" width="480" height="400" role="img" aria-label="Three teams each count a different event as activation">
  <rect width="480" height="400" fill="#0F1C2E"/>
  <rect x="20" y="20" width="440" height="360" rx="16" fill="#16263B"/>
  <text x="44" y="64" fill="#A5B4FC" font-family="Figtree,system-ui,sans-serif" font-size="16" font-weight="700">What counts as activated?</text>
  <text x="44" y="124" fill="#C5D0DC" font-family="Figtree,system-ui,sans-serif" font-size="16">Product</text>
  <text x="160" y="124" fill="#FFFFFF" font-family="Figtree,system-ui,sans-serif" font-size="22" font-weight="700">Checklist done</text>
  <text x="44" y="176" fill="#C5D0DC" font-family="Figtree,system-ui,sans-serif" font-size="16">Growth</text>
  <text x="160" y="176" fill="#FFFFFF" font-family="Figtree,system-ui,sans-serif" font-size="22" font-weight="700">Second login</text>
  <text x="44" y="228" fill="#C5D0DC" font-family="Figtree,system-ui,sans-serif" font-size="16">Design</text>
  <text x="160" y="228" fill="#FFFFFF" font-family="Figtree,system-ui,sans-serif" font-size="22" font-weight="700">Product tour</text>
  <rect x="44" y="268" width="392" height="68" rx="12" fill="#1C2838" stroke="#F5D76E" stroke-width="1.5"/>
  <text x="240" y="308" text-anchor="middle" fill="#F5D76E" font-family="Figtree,system-ui,sans-serif" font-size="18" font-weight="700">The real job is still undone</text>
</svg>
