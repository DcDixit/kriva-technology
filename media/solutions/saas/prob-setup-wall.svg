<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 400" width="480" height="400" role="img" aria-label="Illustration: required setup steps blocking the first action">
  <defs><linearGradient id="s-bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#12181E"/><stop offset="100%" stop-color="#0E1216"/></linearGradient></defs>
  <g font-family="Figtree,system-ui,sans-serif">
  <rect width="480" height="400" fill="url(#s-bg)"/>
  <rect x="16" y="16" width="448" height="36" fill="#12181E" stroke="#232B33"/>
  <circle cx="32" cy="34" r="4" fill="#5C6670"/><circle cx="46" cy="34" r="4" fill="#2A333C"/><circle cx="60" cy="34" r="4" fill="#2A333C"/>
  <text x="76" y="38" fill="#8C98A4" font-size="10" letter-spacing=".12em">SETTINGS · REQUIRED BEFORE USE</text>
  <text x="32" y="88" fill="#FFFFFF" font-size="17" font-weight="700">Finish setup to continue</text>
  <text x="448" y="88" text-anchor="end" fill="#DB9B1F" font-size="12" font-weight="700">0 of 4 done</text>
  <rect x="32" y="104" width="416" height="40" rx="4" fill="#161C22" stroke="#232B33"/>
  <circle cx="52" cy="124" r="6" fill="none" stroke="#5C6670"/>
  <text x="68" y="128" fill="#DDE2E7" font-size="13">Configure SSO</text>
  <text x="432" y="128" text-anchor="end" fill="#8C98A4" font-size="10" letter-spacing=".1em">REQUIRED</text>
  <rect x="32" y="152" width="416" height="40" rx="4" fill="#161C22" stroke="#232B33"/>
  <circle cx="52" cy="172" r="6" fill="none" stroke="#5C6670"/>
  <text x="68" y="176" fill="#DDE2E7" font-size="13">Define the permissions matrix</text>
  <text x="432" y="176" text-anchor="end" fill="#8C98A4" font-size="10" letter-spacing=".1em">REQUIRED</text>
  <rect x="32" y="200" width="416" height="40" rx="4" fill="#161C22" stroke="#232B33"/>
  <circle cx="52" cy="220" r="6" fill="none" stroke="#5C6670"/>
  <text x="68" y="224" fill="#DDE2E7" font-size="13">Connect three integrations</text>
  <text x="432" y="224" text-anchor="end" fill="#8C98A4" font-size="10" letter-spacing=".1em">REQUIRED</text>
  <rect x="32" y="248" width="416" height="40" rx="4" fill="#161C22" stroke="#232B33"/>
  <circle cx="52" cy="268" r="6" fill="none" stroke="#5C6670"/>
  <text x="68" y="272" fill="#DDE2E7" font-size="13">Invite your whole team</text>
  <text x="432" y="272" text-anchor="end" fill="#8C98A4" font-size="10" letter-spacing=".1em">REQUIRED</text>
  <rect x="32" y="304" width="416" height="64" rx="4" fill="#12181E" stroke="#DB9B1F"/>
  <rect x="48" y="320" width="168" height="32" rx="4" fill="#1A2129" stroke="#3A444E"/>
  <text x="132" y="341" text-anchor="middle" fill="#5C6670" font-size="12" font-weight="700">Create first record</text>
  <text x="232" y="332" fill="#DB9B1F" font-size="10" letter-spacing=".1em">LOCKED</text>
  <text x="232" y="350" fill="#8C98A4" font-size="12">The first useful action waits</text>
  </g>
</svg>
