<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 400" width="480" height="400" role="img" aria-label="Required setup steps blocking the first useful action">
  <rect width="480" height="400" fill="#0F1C2E"/>
  <rect x="20" y="20" width="440" height="360" rx="16" fill="#16263B"/>
  <text x="44" y="68" fill="#F5D76E" font-family="Figtree,system-ui,sans-serif" font-size="16" font-weight="700">0 of 3 done</text>
  <text x="44" y="112" fill="#FFFFFF" font-family="Figtree,system-ui,sans-serif" font-size="26" font-weight="700">Setup before use</text>
  <text x="44" y="176" fill="#FFFFFF" font-family="Figtree,system-ui,sans-serif" font-size="22" font-weight="700">Configure SSO</text>
  <text x="436" y="176" text-anchor="end" fill="#F5D76E" font-family="Figtree,system-ui,sans-serif" font-size="16" font-weight="700">Required</text>
  <text x="44" y="224" fill="#FFFFFF" font-family="Figtree,system-ui,sans-serif" font-size="22" font-weight="700">Set permissions</text>
  <text x="436" y="224" text-anchor="end" fill="#F5D76E" font-family="Figtree,system-ui,sans-serif" font-size="16" font-weight="700">Required</text>
  <rect x="44" y="260" width="392" height="72" rx="12" fill="#1C2838" stroke="#F5D76E" stroke-width="1.5"/>
  <text x="64" y="292" fill="#FFFFFF" font-family="Figtree,system-ui,sans-serif" font-size="20" font-weight="700">First action</text>
  <text x="416" y="292" text-anchor="end" fill="#F5D76E" font-family="Figtree,system-ui,sans-serif" font-size="18" font-weight="700">Locked</text>
  <text x="64" y="316" fill="#C5D0DC" font-family="Figtree,system-ui,sans-serif" font-size="16">The useful step waits</text>
</svg>
