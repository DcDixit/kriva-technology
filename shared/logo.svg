<svg viewBox="0 0 800 200" xmlns="http://www.w3.org/2000/svg" width="160" height="40" aria-label="KRIVA Technologies">
  <!-- Geometric K Mark -->
  <g>
    <!-- Black vertical stroke -->
    <rect x="20" y="20" width="50" height="140" fill="#000000"/>

    <!-- Blue diagonal accent -->
    <polygon points="60,20 100,80 100,60 80,20" fill="#5B4FFF"/>

    <!-- Black upper diagonal -->
    <polygon points="70,50 120,20 100,20 70,50" fill="#000000"/>

    <!-- Black lower diagonal -->
    <polygon points="70,100 120,160 140,160 70,120" fill="#000000"/>
  </g>

  <!-- KRIVA Text -->
  <text x="180" y="110" font-family="Arial, sans-serif" font-size="90" font-weight="900" letter-spacing="8" fill="#000000">KRIVA</text>

  <!-- TECHNOLOGIES Text -->
  <text x="180" y="160" font-family="Arial, sans-serif" font-size="32" font-weight="400" letter-spacing="2" fill="#000000">TECHNOLOGIES</text>
</svg>
